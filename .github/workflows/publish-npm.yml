name: Publish to npm / 发布到 npm
run-name: Publish ${{ github.event.release.tag_name || inputs.tag }} to npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z, must match package.json)
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-npm-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish package / 发布安装包
    if: github.repository == 'QwQBiG/dsh-archive-delete'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Match the tag to package.json / 核对版本
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== 'v' + version) {
            console.error('Tag must be v' + version + ', got ' + process.env.RELEASE_TAG);
            process.exitCode = 1;
          }
          JS
      - name: Verify before publishing / 发布前验证
        run: pnpm verify
      - name: Skip if this version is already on npm / 已存在则跳过
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@qwqbig/dsh-archive-delete@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already published; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish / 发布
        if: steps.check.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - name: Summary / 摘要
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          printf '### Published %s\n\nhttps://www.npmjs.com/package/@qwqbig/dsh-archive-delete\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
