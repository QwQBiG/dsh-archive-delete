name: Verify / 验证
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated official native runtime / 安装隔离的官方原生运行时
        run: node scripts/prepare-native-runtime.mjs
      - run: pnpm verify
      - name: Verify committed bundles / 核对已提交的构建产物
        run: git diff --exit-code -- lib
      - run: pnpm pack --pack-destination artifacts
      - name: Hash the release package / 生成发行包校验值
        run: node scripts/release-artifacts.mjs artifacts
      - name: Verify updater can accept the release / 验证更新器可接受发行包
        run: node --import tsx scripts/check-update-package.mjs artifacts
      - name: Verify native package lifecycle / 验证原生安装与卸载
        run: node scripts/verify-package-lifecycle.mjs artifacts
