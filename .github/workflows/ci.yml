name: Verify / 验证
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated official native runtime / 安装隔离的官方原生运行时
        run: node scripts/prepare-native-runtime.mjs
      - run: pnpm verify
      - run: pnpm pack --pack-destination artifacts
